name: Arch Linux and FreeBSD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch:
    name: Arch Linux · x64
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container: archlinux:base-devel
    steps:
      - name: Install Arch build dependencies
        run: pacman -Syu --noconfirm --needed git go gtk4 webkitgtk-6.0 iproute2 glib-networking dbus xorg-server-xvfb xorg-xauth xfce4-panel xfwm4 xdotool imagemagick ttf-dejavu
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and install the package
        shell: bash
        run: |
          useradd --create-home builder
          package_dir=$(mktemp -d)
          cp portable/packaging/arch/PKGBUILD "$package_dir"
          git -c safe.directory="$GITHUB_WORKSPACE" archive --format=tar.gz --prefix=mysafeai-0.1.0/ HEAD LICENSE portable > "$package_dir/mysafeai-0.1.0.tar.gz"
          chown -R builder:builder "$package_dir"
          cd "$package_dir"
          runuser -u builder -- makepkg --noconfirm
          pacman -U --noconfirm mysafeai-*.pkg.tar.zst
          mysafeai --help
          test -f /usr/share/applications/app.mysafeai.desktop.desktop
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp mysafeai-*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"
      - name: Verify the installed Arch window and Xfce tray
        shell: bash
        env:
          # The container's seccomp policy prevents WebKit from starting bubblewrap.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: |
          install -m 755 scripts/test-desktop-tray.sh /tmp/mysafeai-tray-check
          status=0
          runuser -u builder -- xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- /tmp/mysafeai-tray-check /usr/bin/mysafeai /tmp/mysafeai-arch.png || status=$?
          if [ -f /tmp/mysafeai-arch.png ]; then
            install -m 644 /tmp/mysafeai-arch.png dist/mysafeai-arch.png
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('dist/mysafeai-arch.png') != '' }}
        with:
          path: dist/mysafeai-arch.png
          archive: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/mysafeai-*.pkg.tar.zst
          archive: false
          if-no-files-found: error
          retention-days: 30

  freebsd:
    name: FreeBSD 15.1 · amd64
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          sync: rsync
          copyback: true
          prepare: pkg install -y go126 pkgconf gtk4 webkit2-gtk_60 glib-networking xorg-vfbserver dbus xfce4-panel xfce4-wm xdotool
          run: |
            set -eu
            go_bin=$(command -v go126 || command -v go)
            cd portable
            "$go_bin" vet -tags production ./...
            "$go_bin" test -tags production -c -o /tmp/mysafeai-freebsd.test
            pw useradd builder -m -s /bin/sh
            su builder -c '/tmp/mysafeai-freebsd.test -test.v'
            mkdir -p ../dist/freebsd
            "$go_bin" build -tags production -trimpath -o ../dist/freebsd/mysafeai .
            ../dist/freebsd/mysafeai --help
            cp ../LICENSE ../README.md ../dist/freebsd/
            tar -czf ../dist/MySafeAI-FreeBSD-amd64.tar.gz -C ../dist/freebsd mysafeai LICENSE README.md
            install -m 755 ../dist/freebsd/mysafeai /tmp/mysafeai-freebsd
            install -m 755 ../scripts/test-desktop-tray.sh /tmp/mysafeai-tray-check
            su builder -c '
              export PATH=/usr/local/bin:/usr/bin:/bin
              Xvfb :99 -screen 0 1024x768x24 -nolisten tcp &
              display_pid=$!
              trap "kill $display_pid" EXIT
              sleep 1
              DISPLAY=:99 dbus-run-session -- /tmp/mysafeai-freebsd _smoke-ui
              DISPLAY=:99 dbus-run-session -- /tmp/mysafeai-tray-check /tmp/mysafeai-freebsd
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/MySafeAI-FreeBSD-amd64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30
