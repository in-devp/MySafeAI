name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: portable/go.sum
      - run: swift test
      - run: cd portable && go test -race ./browserbridge ./cmd/browser-host
      - run: python3 scripts/test-process-recovery.py
      - run: |
          ./scripts/build-macos.sh
          codesign --verify --strict dist/MySafeAI.app
          python3 -c 'import subprocess; subprocess.run(["dist/MySafeAI.app/Contents/MacOS/MySafeAI", "--smoke-window"], timeout=30, check=True)'
          ditto -c -k --keepParent dist/MySafeAI.app "dist/MySafeAI-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/MySafeAI-macOS-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  portable:
    name: ${{ matrix.platform }} · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, platform: Windows, arch: x64, bin: mysafeai.exe}
          - {runner: windows-11-arm, platform: Windows, arch: arm64, bin: mysafeai.exe}
          - {runner: ubuntu-26.04, platform: Linux, arch: x64, bin: mysafeai}
          - {runner: ubuntu-26.04-arm, platform: Linux, arch: arm64, bin: mysafeai}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: portable
    env:
      CGO_ENABLED: ${{ matrix.platform == 'Linux' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: portable/go.sum
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev glib-networking xvfb xauth dbus-x11
      - name: Add Windows application icon and manifest
        if: runner.os == 'Windows'
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch "$(go env GOARCH)" --manifest gui --product-name MySafeAI --file-description MySafeAI --icon web/tray.png
      - name: Test the policy and process control
        run: |
          go vet -tags production ./...
          go test -tags production -v ./...
      - name: Measure Windows process and route polling
        if: runner.os == 'Windows'
        run: go test -tags production -run '^$' -bench 'BenchmarkWindows(RouteLookup|ProcessInventory)' -benchtime=100x -benchmem .
      - name: Build the application
        run: |
          mkdir -p ../dist/package
          go build -tags production -trimpath -o "../dist/package/${{ matrix.bin }}" .
          go build -trimpath -o "../dist/package/mysafeai-browser-host${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/browser-host
          "../dist/package/${{ matrix.bin }}" --help
          cp ../LICENSE ../README.md ../README.en.md ../dist/package/
      - name: Open and verify the Linux desktop window
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- ../dist/package/mysafeai _smoke-ui
      - name: Build the Windows desktop launcher
        if: runner.os == 'Windows'
        run: go build -tags production -trimpath -ldflags="-H windowsgui" -o ../dist/package/MySafeAI-Desktop.exe .
      - name: Open and verify the Windows desktop launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $launcher = Resolve-Path ../dist/package/MySafeAI-Desktop.exe
          $process = Start-Process -FilePath $launcher -ArgumentList _smoke-ui -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Archive Linux binary
        if: runner.os == 'Linux'
        run: tar -czf "../dist/MySafeAI-Linux-${{ matrix.arch }}.tar.gz" -C ../dist/package mysafeai mysafeai-browser-host LICENSE README.md README.en.md
      - name: Package Linux desktop launcher
        if: runner.os == 'Linux'
        run: ./packaging/linux-deb.sh ../dist/package/mysafeai "../dist/MySafeAI-Linux-${{ matrix.arch }}.deb"
      - name: Archive Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path ../dist/package/* -DestinationPath "../dist/MySafeAI-Windows-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/MySafeAI-${{ matrix.platform }}-${{ matrix.arch }}.${{ runner.os == 'Linux' && 'tar.gz' || 'zip' }}
          archive: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          path: dist/MySafeAI-Linux-${{ matrix.arch }}.deb
          archive: false
          if-no-files-found: error
          retention-days: 30

  browser:
    name: Browser extension
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test browser policy and native connection handling
        run: node --test browser-extension/tests/*.test.cjs portable/web/i18n.test.cjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: portable/go.sum
      - name: Build the native browser test helper
        run: cd portable && go build -trimpath -o ../dist/browser-test-host ./cmd/browser-host
      - name: Package browser extensions
        run: |
          node browser-extension/package.mjs dist/browser-extension
          cd dist/browser-extension/chromium && zip -r ../../MySafeAI-Browser-Chromium.zip .
          cd ../firefox && zip -r ../../MySafeAI-Browser-Firefox.zip .
      - name: Install isolated test browser
        run: npx --yes --package playwright@1.65.0 playwright install --with-deps chromium
      - name: Verify real browser requests and pause page
        env:
          MYSAFEAI_TEST_NO_SANDBOX: "1"
        run: |
          chromium=$(python3 -c 'from pathlib import Path; print(next((Path.home()/".cache/ms-playwright").glob("chromium-*/chrome-linux*/chrome")))')
          test -n "$chromium"
          node scripts/test-browser-extension.mjs "$chromium" dist/browser-extension/chromium dist/browser-test-host
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/MySafeAI-Browser-Chromium.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/MySafeAI-Browser-Firefox.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
