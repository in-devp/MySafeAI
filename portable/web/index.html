<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MySafeAI</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="panel.js" defer></script>
</head>
<body>
  <main>
    <header><img src="icon.svg" alt="" width="36" height="36"><h1>MySafeAI</h1><button id="exit" class="quiet">Выйти</button></header>
    <section class="status" aria-live="polite">
      <p id="status">Подключите VPN и выберите его адаптер.</p>
      <strong id="ip"></strong>
      <ul id="providers"></ul>
      <button id="check">Проверить маршрут</button>
    </section>
    <section class="card">
      <h2>Правило подключения</h2>
      <label for="adapter">VPN-адаптер</label>
      <select id="adapter"></select>
      <label for="allowed">Доверенные IP и подсети</label>
      <textarea id="allowed" rows="3" placeholder="203.0.113.42&#10;2001:db8::/48"></textarea>
      <div class="actions"><button id="save">Сохранить правило</button><button id="trust" class="quiet" hidden>Добавить проверенные IP</button></div>
    </section>
    <section class="card">
      <h2>Запуск под защитой</h2>
      <label for="command">Путь к программе или имя команды</label>
      <input id="command" placeholder="cursor или C:\Путь\Программа.exe">
      <label for="args">Аргументы, по одному на строку</label>
      <textarea id="args" rows="2"></textarea>
      <div class="actions"><button id="launch">Запустить</button></div>
      <ul id="running"></ul>
      <p class="hint">Для интерактивных команд используйте <code>mysafeai run -- codex</code> в терминале.</p>
    </section>
    <section class="card">
      <h2>Журнал</h2>
      <ul id="journal"></ul>
    </section>
    <p id="notice" role="status"></p>
  </main>
</body>
</html>
